
########################################
##### Options
########################################
# TrueColorに対応するため
set-option -g default-terminal "tmux-256color" # 基本的にはscreen-256colorかtmux-256colorを設定
set-option -ga terminal-overrides ",$TERM:Tc" # tmuxを起動していない時のzshでの$TERMの値を指定


# zshと同様の値。たくさん履歴を遡れるようにしておく
set-option -g history-limit 10000

# statusに秒数まで表示させる
set-option -g status-left "[#S] "
set-option -g status-right-length 60
set-option -g status-right "\"#H\" %Y/%m/%d %H:%M:%S"
set-option -g status-interval 1

# マウス操作できるように
set-option -g mouse on

# キー入力待ち時間。シュッと動けるように
set -g escape-time 0

# OSのクリップボードへのアクセスを許可
# VS Code(xterm.js) は OSC 52 の base64 を atob() で Latin-1 として誤復号し、
# 日本語など UTF-8 マルチバイトを文字化けさせる（例: 日(e697a5) -> c3a6c297c2a5）。
# tmux 側は正しい UTF-8 を送っており、tmux 内ペースト(prefix+])は常に正常。
# そのため OSC 52（set-clipboard on）を無効化し、コピーを pbcopy に直結して正しい UTF-8 を渡す。
# 参考:
#   xterm.js OSC 52: https://github.com/xtermjs/xterm.js/issues/3260
#   VS Code OSC 52 : https://github.com/microsoft/vscode/issues/210302
#   仕組み(atob -> Latin-1 誤復号): https://forum.cursor.com/t/cursor-integrated-terminal-corrupts-utf-8-osc-52-clipboard-text-from-tmux/162481
# 注意: pbcopy はローカル前提。SSH 先の tmux では効かない（その場合は OSC 52 が必要）。
set -g set-clipboard off
# マウスドラッグ完了時に選択範囲を pbcopy へ流す（ドラッグ中のキー操作は不要）
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
# ダブルクリック（単語）・トリプルクリック（行）も pbcopy 経由でコピーする
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel 'pbcopy'
# キーボード copy-mode の y / Enter も pbcopy 経由でコピーする
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'

########################################
##### Keybind
########################################
# Ctrl-Bが押しづらいので、Ctrl-Zにリマップ
# shellのCtrl-Zと被るため、Ctrl-Zをもう一度入力するとCtrl-Zを送るように
unbind-key C-b
set -g prefix C-z
bind-key C-z send-prefix
bind C-z send-keys C-z

# vim風に操作できるように
set-window-option -g mode-keys vi

# vim風にペインの移動ができるように
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインのサイズ変更
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5


# ウィンドウの作成
bind c new-window -c "#{pane_current_path}"

# 画面分割
bind % split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"

# tmux.confの再読み込み
bind r source-file ~/.tmux.conf \; display-message ".tmux.conf reloaded!"   

